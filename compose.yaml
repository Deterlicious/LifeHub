name: lifehub

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifehub}
      POSTGRES_USER: ${POSTGRES_USER:-lifehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifehub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - lifehub_postgres_data:/var/lib/postgresql

volumes:
  lifehub_postgres_data:
