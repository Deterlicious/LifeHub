services:
  - type: web
    name: lifehub-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    dockerCommand: /usr/local/bin/api
    preDeployCommand: /usr/local/bin/migrate
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 45
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifehub-postgres
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_AUDIENCE
        value: authenticated

  - type: worker
    name: lifehub-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    dockerCommand: /usr/local/bin/worker
    maxShutdownDelaySeconds: 45
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifehub-postgres
          property: connectionString

  - type: web
    name: lifehub-web
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_AUTH_MODE
        value: supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false

databases:
  - name: lifehub-postgres
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: lifehub
    user: lifehub
    ipAllowList: []
